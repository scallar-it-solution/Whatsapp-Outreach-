services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  outreach-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      REDIS_URL: redis://redis:6379
      SQLITE_PATH: /app/data/outreach.db
    ports:
      - "${APP_PORT:-3000}:${APP_PORT:-3000}"
    volumes:
      - ../data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${APP_PORT:-3000}/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  outreach-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    env_file:
      - ../.env
    environment:
      REDIS_URL: redis://redis:6379
      SQLITE_PATH: /app/data/outreach.db
    volumes:
      - ../data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      outreach-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"process.exit(0)\""]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  redis-data:
