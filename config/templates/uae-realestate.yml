templates:
  - id: uae-re-short-1
    name: chatbot-followup
    ab_label: A
    body: |
      Hi {{business_name}}, many real estate leads go cold when WhatsApp follow-up is delayed.

      We build WhatsApp systems for:
      - Instant chatbot replies
      - Lead qualification
      - Auto follow-ups and visit reminders

      Reply YES if you want to see a quick demo.

      - Scallar IT Solutions

  - id: uae-re-short-2
    name: whatsapp-assistant
    ab_label: B
    body: |
      Hi {{business_name}}, we can set up a WhatsApp assistant for your real estate inquiries.

      It can reply instantly, share project details, qualify budget/location, and follow up automatically.

      Reply DEMO and I will send a short walkthrough.

      - Scallar IT Solutions
