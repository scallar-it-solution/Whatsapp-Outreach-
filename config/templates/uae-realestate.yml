set: uae-realestate
country: UAE
category: real_estate
templates:
  - id: uae-re-1
    name: instant-reply
    ab_label: A
    body: |
      Hi {{business_name}}, quick question - are your property leads on WhatsApp getting replied to fast enough?

      We help real estate teams in UAE automate:
      - Instant inquiry replies
      - Buyer qualification by budget and location
      - Site visit bookings

      Reply DEMO and I'll show you a simple 5-min workflow.

      - Scallar IT Solutions

  - id: uae-re-2
    name: cold-leads
    ab_label: B
    body: |
      Hi {{business_name}} - how many leads go cold because no one replied in time?

      We fix that with WhatsApp automation:
      - Auto-reply 24/7, even after hours
      - Send property details instantly
      - Book site visits without manual work

      Reply YES and I'll send a quick walkthrough.

      - Scallar IT Solutions

  - id: uae-re-3
    name: bot-intro
    ab_label: C
    body: |
      Hi {{business_name}} - we build WhatsApp bots for real estate agencies in UAE.

      Your bot handles:
      - New inquiries automatically
      - Property shortlisting by budget
      - Follow-ups without your agents lifting a finger

      Takes 7 days to set up. Reply INTERESTED to see how it works.

      - Scallar IT Solutions
